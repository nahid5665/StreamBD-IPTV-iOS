name: Build Eentertainment iOS IPA

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

permissions:
  contents: write

jobs:
  build-ipa:
    runs-on: macos-15
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: xcodegen generate

      - name: Resolve Swift Packages
        run: xcodebuild -resolvePackageDependencies -project Eentertainment.xcodeproj

      - name: Build Unsigned iOS App (arm64)
        run: |
          xcodebuild clean build \
            -project Eentertainment.xcodeproj \
            -scheme Eentertainment \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Package .app into Unsigned .ipa (LiveContainer / SideStore / Sideloadly Ready)
        run: |
          mkdir -p Payload
          cp -r build/Build/Products/Release-iphoneos/Eentertainment.app Payload/
          zip -r9 Eentertainment-v5.7.1-iOS.ipa Payload

      - name: Upload Unsigned IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Eentertainment-v5.7.1-iOS-IPA
          path: Eentertainment-v5.7.1-iOS.ipa
          if-no-files-found: error

      - name: Publish Direct IPA to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v5.7.1-eentertainment
          name: "Eentertainment v5.7.1 — Cheerio/Axios Shims, Buffer Base64 Fix & Cineplex Direct Scraper"
          body: |
            ### Eentertainment v5.7.1
            
            🎬 **Cheerio/Axios DOM Shims + Buffer Base64 Fix + Cineplex Direct 2-Step Session Scraper**

            #### What's Fixed in v5.7.1:
            1. **DOMParser-backed `cheerio` & Fetch-backed `axios` shims**:
               - Added comprehensive DOMParser-backed `cheerio.load()` supporting `$('...')`, `.text()`, `.html()`, `.attr()`, `.each()`, `.find()`, `.first()`, `.last()`, `.eq()`.
               - Added fetch-backed `axios.get()` and `axios.post()` returning `{ data, status, headers, ok }`.
               - Prevents `TypeError: cheerio.load is not a function` and missing module crashes in `.js` addons.
            2. **Buffer Base64 Encode/Decode Fix**:
               - Fixed inverted `Buffer.from(data).toString('base64')` to properly call `btoa()` for encoding and `atob()` for decoding.
               - Fixes encrypted payload parsing, XOR decryption, and auth tokens.
            3. **Eliminated Wasted Double Execution Round-Trip**:
               - Replaced dual-execution attempt with single-pass invocation and clear error reporting `{ error: err.message }`.
               - Prevents redundant network calls from tripping the 10-second timeout.
            4. **Cineplex BD Priority & 2-Step Session Scraper**:
               - `AddonResolverService` prioritizes fast native `CineplexScraper` directly for Cineplex.
               - `CineplexScraper` performs authentic 2-step session flow: `GET view.php` (capture session cookie) -> `GET player.php` with session cookie and referer.
               - Full query sanitization (strip colons, dashes, apostrophes, ampersands) and primary title prefix fallback.
          files: Eentertainment-v5.7.1-iOS.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
