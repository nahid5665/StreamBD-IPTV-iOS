name: Build Eentertainment iOS IPA

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

permissions:
  contents: write

jobs:
  build-ipa:
    runs-on: macos-15
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: xcodegen generate

      - name: Resolve Swift Packages
        run: xcodebuild -resolvePackageDependencies -project Eentertainment.xcodeproj

      - name: Build Unsigned iOS App (arm64)
        run: |
          xcodebuild clean build \
            -project Eentertainment.xcodeproj \
            -scheme Eentertainment \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Package .app into Unsigned .ipa (LiveContainer / SideStore / Sideloadly Ready)
        run: |
          mkdir -p Payload
          cp -r build/Build/Products/Release-iphoneos/Eentertainment.app Payload/
          zip -r9 Eentertainment-v5.7.3-iOS.ipa Payload

      - name: Upload Unsigned IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Eentertainment-v5.7.3-iOS-IPA
          path: Eentertainment-v5.7.3-iOS.ipa
          if-no-files-found: error

      - name: Publish Direct IPA to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v5.7.3-eentertainment
          name: "Eentertainment v5.7.3 — In-App Addon Diagnostics (Cineplex Test)"
          body: |
            ### Eentertainment v5.7.3

            🩺 **On-device Addon Diagnostics — debug without a Mac**

            #### What's New in v5.7.3:
            1. **Addon Diagnostics screen** (Settings → Addon Diagnostics):
               - Live in-app log buffer for the whole addon pipeline (fetch bridge, prewarm, scrapers, resolver).
               - "Run Cineplex Test" button: probes `http://cineplexbd.net` reachability, runs the native
                 2-step scraper AND the JS fallback for 'Inception', and reports every step + resulting streams.
               - Copy-to-clipboard + clear buttons for sharing results.
            2. **Resolver/scraper result logging**: every addon's stream count (or failure reason) is logged
               during normal movie lookups, visible in the diagnostics screen.
          files: Eentertainment-v5.7.3-iOS.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
