name: Build Eentertainment iOS IPA

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

permissions:
  contents: write

jobs:
  build-ipa:
    runs-on: macos-15
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: xcodegen generate

      - name: Resolve Swift Packages
        run: xcodebuild -resolvePackageDependencies -project Eentertainment.xcodeproj

      - name: Build Unsigned iOS App (arm64)
        run: |
          xcodebuild clean build \
            -project Eentertainment.xcodeproj \
            -scheme Eentertainment \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Package .app into Unsigned .ipa (LiveContainer / SideStore / Sideloadly Ready)
        run: |
          mkdir -p Payload
          cp -r build/Build/Products/Release-iphoneos/Eentertainment.app Payload/
          zip -r9 Eentertainment-v5.8.2-iOS.ipa Payload

      - name: Upload Unsigned IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Eentertainment-v5.8.2-iOS-IPA
          path: Eentertainment-v5.8.2-iOS.ipa
          if-no-files-found: error

      - name: Publish Direct IPA to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v5.8.2-eentertainment
          name: "Eentertainment v5.8.2 — Remote Registry Merge Removed (Addon List Is Final)"
          body: |
            ### Eentertainment v5.8.2

            🧹 **The 20 extra addons are really gone now**

            #### What's Fixed in v5.8.2:
            1. **Root cause of the 23-addon list**: at startup the app was fetching the remote
               addon registry (StreamBD_IPTV_Addon.json) and appending ALL of its addons on top
               of the bundled ones — undoing the trim. The remote merge is removed entirely.
            2. **Addon list is now final**: exactly the 3 bundled resolvers (Cineplex BD, CTG
               Movies FTP, RoarZone EMBY) plus any addons you personally add in Settings
               (.js scraper URLs or Stremio manifests). Movie pages only check those.
            3. Combined with the 10-minute result cache from v5.7.9, repeat visits are instant.
          files: Eentertainment-v5.8.2-iOS.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
