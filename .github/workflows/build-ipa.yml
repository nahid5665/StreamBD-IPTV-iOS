name: Build Eentertainment iOS IPA

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

permissions:
  contents: write

jobs:
  build-ipa:
    runs-on: macos-15
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: xcodegen generate

      - name: Resolve Swift Packages
        run: xcodebuild -resolvePackageDependencies -project Eentertainment.xcodeproj

      - name: Build Unsigned iOS App (arm64)
        run: |
          xcodebuild clean build \
            -project Eentertainment.xcodeproj \
            -scheme Eentertainment \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Package .app into Unsigned .ipa (LiveContainer / SideStore / Sideloadly Ready)
        run: |
          mkdir -p Payload
          cp -r build/Build/Products/Release-iphoneos/Eentertainment.app Payload/
          zip -r9 Eentertainment-v5.7.5-iOS.ipa Payload

      - name: Upload Unsigned IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Eentertainment-v5.7.5-iOS-IPA
          path: Eentertainment-v5.7.5-iOS.ipa
          if-no-files-found: error

      - name: Publish Direct IPA to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v5.7.5-eentertainment
          name: "Eentertainment v5.7.5 — Cineplex Scraper UA Fallback + Full Failure Logging"
          body: |
            ### Eentertainment v5.7.5

            🔍 **Diagnostics round 2 — every silent failure now logs itself**

            #### What's Changed in v5.7.5:
            1. **CineplexScraper UA-strategy fallback**:
               - ATS is fixed, but the site still returned nothing with the desktop-Chrome UA
                 while the diagnostics probe (session default UA) succeeded. Search now tries
                 session-default UA → iOS Safari UA → desktop Chrome UA and keeps whichever works.
            2. **No more swallowed errors**:
               - search/view/player steps and every JS-runner stage (script fetch, bootstrap,
                 plugin evaluate, invoke) now log real HTTP codes, byte counts and error messages.
            3. Version bump 5.7.5 (build 66). Diagnostics screen unchanged — run the same test.
          files: Eentertainment-v5.7.5-iOS.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
