name: Build StreamBD IPTV iOS IPA

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build-ipa:
    runs-on: macos-15
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: xcodegen generate

      - name: Build Unsigned iOS App (arm64)
        run: |
          xcodebuild clean build             -project StreamBDIPTV.xcodeproj             -scheme StreamBDIPTV             -configuration Release             -sdk iphoneos             -derivedDataPath build             ARCHS=arm64             ONLY_ACTIVE_ARCH=NO             CODE_SIGN_IDENTITY=""             CODE_SIGNING_REQUIRED=NO             CODE_SIGNING_ALLOWED=NO

      - name: Package .app into Unsigned .ipa (LiveContainer / SideStore / Sideloadly Ready)
        run: |
          mkdir -p Payload
          cp -r build/Build/Products/Release-iphoneos/StreamBDIPTV.app Payload/
          ldid -S Payload/StreamBDIPTV.app/StreamBDIPTV || true
          zip -r9 StreamBD-IPTV-v5.0-iOS.ipa Payload

      - name: Upload Unsigned IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: StreamBD-IPTV-v5.0-iOS-IPA
          path: StreamBD-IPTV-v5.0-iOS.ipa
          if-no-files-found: error
