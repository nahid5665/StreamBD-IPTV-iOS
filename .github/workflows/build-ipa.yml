name: Build Eentertainment iOS IPA

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

permissions:
  contents: write

jobs:
  build-ipa:
    runs-on: macos-15
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: xcodegen generate

      - name: Resolve Swift Packages
        run: xcodebuild -resolvePackageDependencies -project Eentertainment.xcodeproj

      - name: Build Unsigned iOS App (arm64)
        run: |
          xcodebuild clean build \
            -project Eentertainment.xcodeproj \
            -scheme Eentertainment \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Package .app into Unsigned .ipa (LiveContainer / SideStore / Sideloadly Ready)
        run: |
          mkdir -p Payload
          cp -r build/Build/Products/Release-iphoneos/Eentertainment.app Payload/
          zip -r9 Eentertainment-v5.7.4-iOS.ipa Payload

      - name: Upload Unsigned IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Eentertainment-v5.7.4-iOS-IPA
          path: Eentertainment-v5.7.4-iOS.ipa
          if-no-files-found: error

      - name: Publish Direct IPA to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v5.7.4-eentertainment
          name: "Eentertainment v5.7.4 — ATS Fix: Plain-HTTP Scraping Unblocked (Cineplex)"
          body: |
            ### Eentertainment v5.7.4

            🚀 **ROOT CAUSE FIX — App Transport Security was blocking every plain-HTTP scraper**

            #### What's Fixed in v5.7.4:
            1. **ATS key conflict (the real cineplex blocker)**:
               - `NSAllowsArbitraryLoadsInWebContent` was present in Info.plist alongside
                 `NSAllowsArbitraryLoads`. Per Apple's ATS rules, when the web-content key is
                 present the system IGNORES `NSAllowsArbitraryLoads` — so every URLSession
                 request to `http://cineplexbd.net` (native scraper + JS fetch bridge) failed
                 with "App Transport Security policy requires the use of a secure connection".
               - Removed `NSAllowsArbitraryLoadsInWebContent`; `NSAllowsArbitraryLoads` now
                 actually applies, allowing plain-HTTP scraping exactly like Android's
                 `usesCleartextTraffic="true"`.
            2. Diagnostics screen (from v5.7.3) kept for on-device verification.
          files: Eentertainment-v5.7.4-iOS.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
