name: Build Eentertainment iOS IPA

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

permissions:
  contents: write

jobs:
  build-ipa:
    runs-on: macos-15
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: xcodegen generate

      - name: Resolve Swift Packages
        run: xcodebuild -resolvePackageDependencies -project Eentertainment.xcodeproj

      - name: Build Unsigned iOS App (arm64)
        run: |
          xcodebuild clean build \
            -project Eentertainment.xcodeproj \
            -scheme Eentertainment \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Package .app into Unsigned .ipa (LiveContainer / SideStore / Sideloadly Ready)
        run: |
          mkdir -p Payload
          cp -r build/Build/Products/Release-iphoneos/Eentertainment.app Payload/
          zip -r9 Eentertainment-v5.7.9-iOS.ipa Payload

      - name: Upload Unsigned IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Eentertainment-v5.7.9-iOS-IPA
          path: Eentertainment-v5.7.9-iOS.ipa
          if-no-files-found: error

      - name: Publish Direct IPA to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v5.7.9-eentertainment
          name: "Eentertainment v5.7.9 — 10 More Addons Fixed (return-style) + 8x Faster Lookups"
          body: |
            ### Eentertainment v5.7.9

            🚀 **Addons 11-20 unlocked + much faster movie pages**

            #### What's Fixed in v5.7.9:
            1. **Top-level `return` addons now work (APK-parity)**:
               - 10 addons (hdhub4u, NHD, ppcine, rtally, cinetv, ftpbdcdn, ftpbdweb,
                 ibccl-ftp, OMH, timepassbdweb) end with `return fn;` — only legal when
                 the host wraps the script in a function (as Android does). The runner
                 now wraps every addon in an IIFE and captures the returned function
                 into module.exports. These addons previously threw SyntaxError.
            2. **XMLHttpRequest shim** (netmirror, ibccl-ftp): XHR requests now route
               through the native fetch bridge instead of being CORS-blocked.
            3. **Faster movie pages**:
               - JS addon concurrency raised 3 → 8 (WebViews are lightweight).
               - 10-minute per-addon result cache: revisiting a title is instant.
          files: Eentertainment-v5.7.9-iOS.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
