name: Build Eentertainment iOS IPA

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

permissions:
  contents: write

jobs:
  build-ipa:
    runs-on: macos-15
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: xcodegen generate

      - name: Resolve Swift Packages
        run: xcodebuild -resolvePackageDependencies -project Eentertainment.xcodeproj

      - name: Build Unsigned iOS App (arm64)
        run: |
          xcodebuild clean build \
            -project Eentertainment.xcodeproj \
            -scheme Eentertainment \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Package .app into Unsigned .ipa (LiveContainer / SideStore / Sideloadly Ready)
        run: |
          mkdir -p Payload
          cp -r build/Build/Products/Release-iphoneos/Eentertainment.app Payload/
          zip -r9 Eentertainment-v5.8.2-iOS.ipa Payload

      - name: Upload Unsigned IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Eentertainment-v5.8.2-iOS-IPA
          path: Eentertainment-v5.8.2-iOS.ipa
          if-no-files-found: error

      - name: Publish Direct IPA to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v5.8.2-eentertainment
          name: "Eentertainment v5.8.2 — JS Addon Persistence Fix + BDTube Live Server"
          body: |
            ### Eentertainment v5.8.2

            #### What's Fixed in this build:
            1. **JS addons no longer erased on restart**: user-added `.js` addons were
               never saved to UserDefaults (only Stremio addons were persisted), so they
               vanished every relaunch. Both kinds are persisted now.
            2. **Live TV replaced with the BDTube server**: all bundled StreamBD/BDIX/
               Jio/PlusBox playlist servers removed. Live TV now loads channels from the
               BDTube API (TV endpoint `:8889` first, web endpoint fallback).
            3. **Auto token refresh (BDTube widget parity)**: the app parses the signed
               `session=...-<start>-<expiry>` timestamps in stream URLs and auto-refreshes
               30 minutes before expiry (or every 2h max), swapping fresh URLs in-place
               without interrupting playback.
            4. Combined with the 10-minute result cache from v5.7.9, repeat visits are instant.
          files: Eentertainment-v5.8.2-iOS.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
