name: Build Eentertainment iOS IPA

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

permissions:
  contents: write

jobs:
  build-ipa:
    runs-on: macos-15
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: xcodegen generate

      - name: Resolve Swift Packages
        run: xcodebuild -resolvePackageDependencies -project Eentertainment.xcodeproj

      - name: Build Unsigned iOS App (arm64)
        run: |
          xcodebuild clean build \
            -project Eentertainment.xcodeproj \
            -scheme Eentertainment \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Package .app into Unsigned .ipa (LiveContainer / SideStore / Sideloadly Ready)
        run: |
          mkdir -p Payload
          cp -r build/Build/Products/Release-iphoneos/Eentertainment.app Payload/
          zip -r9 Eentertainment-v5.3-iOS.ipa Payload

      - name: Upload Unsigned IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Eentertainment-v5.3-iOS-IPA
          path: Eentertainment-v5.3-iOS.ipa
          if-no-files-found: error

      - name: Publish Direct IPA to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v5.3.0-eentertainment
          name: "Eentertainment v5.3.0 — Apple Liquid Glass + 44 Playlists + 24 Addons"
          body: |
            ### Eentertainment v5.3.0

            🎬 **Complete Streaming App — Liquid Glass Apple Design**

            #### What's New in v5.3
            - **New App Name**: Eentertainment (renamed from StreamBD IPTV)
            - **Apple Liquid Glass UI**: Authentic iOS-style blur, spring physics, and fluid motion
            - **Spring Animations**: Interactive press states with `.interactiveSpring()` physics
            - **Tactile Feedback**: ScaleButtonStyle with haptic press response
            - **Ambient Glow Effects**: Colored backdrop blur halos behind cards

            #### Core Features
            - **Universal VLC Engine**: Hardware-accelerated MKV, M3U8, TS, MP4, FLV, AVI playback
            - **44 Live IPTV Playlists**: Bangla TV, Sports, BDIX FTP, Indian TV, OTT, International
            - **24 Movie & Series Addons**: CTG Movies, Cineplex BD, RoarZone, 11Plus, Net Mirror, VixSrc, PPCine, MovieBox, and more
            - **Auto Token Refresh**: 2-hour loop for PlusBox, Jio TV, Toffee, Oxoo portals
            - **Smart Addon Filtering**: Only shows addons that actually have the selected movie/series
            - **TMDB Integration**: Trending movies, Bangla films, Bollywood, top-rated, search

            #### Install
            - **AltStore / SideStore / LiveContainer**: Direct IPA install
            - **TrollStore**: Sign and install directly
            - **Sideloadly**: Drag `.ipa` and sideload
          files: Eentertainment-v5.3-iOS.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
