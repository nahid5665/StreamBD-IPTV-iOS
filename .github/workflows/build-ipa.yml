name: Build Eentertainment iOS IPA

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

permissions:
  contents: write

jobs:
  build-ipa:
    runs-on: macos-15
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: xcodegen generate

      - name: Resolve Swift Packages
        run: xcodebuild -resolvePackageDependencies -project Eentertainment.xcodeproj

      - name: Build Unsigned iOS App (arm64)
        run: |
          xcodebuild clean build \
            -project Eentertainment.xcodeproj \
            -scheme Eentertainment \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Package .app into Unsigned .ipa (LiveContainer / SideStore / Sideloadly Ready)
        run: |
          mkdir -p Payload
          cp -r build/Build/Products/Release-iphoneos/Eentertainment.app Payload/
          zip -r9 Eentertainment-v5.7.6-iOS.ipa Payload

      - name: Upload Unsigned IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Eentertainment-v5.7.6-iOS-IPA
          path: Eentertainment-v5.7.6-iOS.ipa
          if-no-files-found: error

      - name: Publish Direct IPA to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v5.7.6-eentertainment
          name: "Eentertainment v5.7.6 — Player Engine Chooser (Settings → Video Player)"
          body: |
            ### Eentertainment v5.7.6

            🎛️ **Choose your player engine — new Settings section**

            #### What's New in v5.7.6:
            1. **Settings → Video Player**: pick **Auto / VLC / AVPlayer** as your player engine.
               - **Auto** (default): VLC for TS/MKV/RTMP streams, AVPlayer first for the rest, automatic VLC fallback on AVPlayer failure.
               - **VLC**: MobileVLCKit plays everything — maximum format compatibility with addon-supplied headers.
               - **AVPlayer**: Apple-native engine everywhere (AirPlay, Picture-in-Picture); no automatic fallback, manual engine switch still available in the player HUD.
            2. Preference is persisted across launches; the in-player HUD engine-switch button still works for one-off changes.
            3. Note: the VLC *engine* (MobileVLCKit) was already embedded — this adds full user control over when it is used. The standalone VLC app UI cannot be embedded into another app (licensing + architecture).
          files: Eentertainment-v5.7.6-iOS.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
