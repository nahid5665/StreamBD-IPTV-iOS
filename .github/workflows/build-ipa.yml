name: Build Eentertainment iOS IPA

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

permissions:
  contents: write

jobs:
  build-ipa:
    runs-on: macos-15
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: xcodegen generate

      - name: Resolve Swift Packages
        run: xcodebuild -resolvePackageDependencies -project Eentertainment.xcodeproj

      - name: Build Unsigned iOS App (arm64)
        run: |
          xcodebuild clean build \
            -project Eentertainment.xcodeproj \
            -scheme Eentertainment \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Package .app into Unsigned .ipa (LiveContainer / SideStore / Sideloadly Ready)
        run: |
          mkdir -p Payload
          cp -r build/Build/Products/Release-iphoneos/Eentertainment.app Payload/
          zip -r9 Eentertainment-v5.6-iOS.ipa Payload

      - name: Upload Unsigned IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Eentertainment-v5.6-iOS-IPA
          path: Eentertainment-v5.6-iOS.ipa
          if-no-files-found: error

      - name: Publish Direct IPA to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v5.6.1-eentertainment
          name: "Eentertainment v5.6.1 — Player Auto-Fallback, Stremio Settings & Emby Direct Stream Fix"
          body: |
            ### Eentertainment v5.6.1

            🎬 **Dual-Engine Auto-Fallback + Safe PlaybackRequest + Stremio Addons Settings UI + Emby Direct Streams**

            #### What's Fixed & Added in v5.6.1:
            1. **Black-Screen Modal Trap Fix (`PlaybackRequest`)**:
               - Replaced `.fullScreenCover(isPresented:)` with `.fullScreenCover(item: $activePlayback)` using validated non-optional `PlaybackRequest`.
               - If stream URL is invalid, cover is never opened and an informative alert is shown.
            2. **Permanent Back/Close Button**:
               - Top-left Back button is elevated (`.zIndex(200)`) with safe-area top padding and is **always visible** while loading, buffering, or on error.
            3. **Player Auto-Fallback & Manual Switch**:
               - Automatically falls back from Apple native AVPlayer to MobileVLCKit if `AVPlayerItem.status == .failed`.
               - Dedicated **AVPlayer / VLC** manual toggle button in the HUD top bar.
               - On-screen error banner with retry and engine switch options.
            4. **MobileVLCKit Header & Network Fix**:
               - Removed unsupported `:http-custom-headers=`, added `:http-referrer=`, `:http-user-agent=`, and `:http-reconnect=true`.
            5. **RoarZone Emby Stream Fix**:
               - Added `MediaSourceId` and `DeviceId=Eentertainment-iOS` to HLS master playlists.
               - Added direct stream URL option (`/Videos/{id}/stream?static=true`) for direct MobileVLCKit decoding.
            6. **Stremio Addon Management Settings UI**:
               - New Settings tab with custom Stremio HTTP Addon URL installer (`.../manifest.json`).
               - Persistent addon storage via `UserDefaults`.
               - Quick preset buttons (Torrentio, Cinemeta, CyberFlix).
               - Addon toggle and delete controls.
          files: Eentertainment-v5.6-iOS.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
