name: Build Eentertainment iOS IPA

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

permissions:
  contents: write

jobs:
  build-ipa:
    runs-on: macos-15
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: xcodegen generate

      - name: Resolve Swift Packages
        run: xcodebuild -resolvePackageDependencies -project Eentertainment.xcodeproj

      - name: Build Unsigned iOS App (arm64)
        run: |
          xcodebuild clean build \
            -project Eentertainment.xcodeproj \
            -scheme Eentertainment \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Package .app into Unsigned .ipa (LiveContainer / SideStore / Sideloadly Ready)
        run: |
          mkdir -p Payload
          cp -r build/Build/Products/Release-iphoneos/Eentertainment.app Payload/
          zip -r9 Eentertainment-v5.4-iOS.ipa Payload

      - name: Upload Unsigned IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Eentertainment-v5.4-iOS-IPA
          path: Eentertainment-v5.4-iOS.ipa
          if-no-files-found: error

      - name: Publish Direct IPA to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v5.4.0-eentertainment
          name: "Eentertainment v5.4.0 — Fullscreen VLC Player & Dynamic Addons"
          body: |
            ### Eentertainment v5.4.0

            🎬 **VLC Fullscreen Video Player + Dynamic Addons + FTP Token Engine**

            #### What's New in v5.4
            - **Native True Fullscreen Video Player**:
              - Dedicated Fullscreen HUD controls with auto-fade timer (4s)
              - Aspect Ratio toggle (Fit, Fill, 16:9, 4:3)
              - Scrub slider with exact timestamp seeking
              - 10-second skip forward & backward
              - One-tap fullscreen expansion for both Live TV and VOD Movies/Series
            - **Strict Dynamic Addon Filtering**:
              - Removed all fake/dummy static fallbacks (no more non-working RoarZone, 11plus, NetMirror, MultiEmbed clutter)
              - Addons are now verified dynamically in real time: only addons that actually possess the movie will appear
              - CTG Movies (BDIX Next.js RSC payload extractor)
              - CineplexBD (BDIX API v2)
              - RoarZone (Emby public authentication & M3U8 stream)
              - VixSrc HD (TMDB resolver)
            - **Enhanced FTP Token Engine**:
              - PlusBox on-demand channel token resolution (no more 40s freezes or 403 Forbidden errors)
              - Proper LibVLC HTTP header injection (`:http-custom-headers` with `Cookie`, `Origin`, and `Referer`)
              - Fast native parsing for JS playlists
            - **Apple Liquid Glass Interface**:
              - iOS spring physics with `ScaleButtonStyle`
              - Fluid blurred depth and ambient halos
          files: Eentertainment-v5.4-iOS.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
