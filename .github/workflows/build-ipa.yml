name: Build Eentertainment iOS IPA

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

permissions:
  contents: write

jobs:
  build-ipa:
    runs-on: macos-15
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: xcodegen generate

      - name: Resolve Swift Packages
        run: xcodebuild -resolvePackageDependencies -project Eentertainment.xcodeproj

      - name: Build Unsigned iOS App (arm64)
        run: |
          xcodebuild clean build \
            -project Eentertainment.xcodeproj \
            -scheme Eentertainment \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Package .app into Unsigned .ipa (LiveContainer / SideStore / Sideloadly Ready)
        run: |
          mkdir -p Payload
          cp -r build/Build/Products/Release-iphoneos/Eentertainment.app Payload/
          zip -r9 Eentertainment-v5.8.1-iOS.ipa Payload

      - name: Upload Unsigned IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Eentertainment-v5.8.1-iOS-IPA
          path: Eentertainment-v5.8.1-iOS.ipa
          if-no-files-found: error

      - name: Publish Direct IPA to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v5.8.1-eentertainment
          name: "Eentertainment v5.8.1 — External Player (Hand Streams to VLC App)"
          body: |
            ### Eentertainment v5.8.1

            📺 **Play streams in the real VLC app on your iPhone**

            #### What's New in v5.8.1:
            1. **Settings → External Player**: choose where streams play — **This App** or **VLC App**.
               - When VLC App is selected, every resolved stream is handed to the installed VLC
                 app via its x-callback-url scheme and starts playing there immediately.
               - VLC detection status shown in Settings (requires the VLC app from the App Store).
            2. **Per-stream "cone" button** in the movie page stream list: hand any individual
               stream to VLC with one tap, regardless of the setting.
            3. Embed streams always stay in-app (VLC can't scrape web embed pages).
            4. Note: the URL handoff carries the stream URL + title only — custom Referer/Cookie
               headers are not forwarded, so header-protected BDIX streams may refuse in VLC.
          files: Eentertainment-v5.8.1-iOS.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
