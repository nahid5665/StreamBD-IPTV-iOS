name: Build Eentertainment iOS IPA

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

permissions:
  contents: write

jobs:
  build-ipa:
    runs-on: macos-15
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: xcodegen generate

      - name: Resolve Swift Packages
        run: xcodebuild -resolvePackageDependencies -project Eentertainment.xcodeproj

      - name: Build Unsigned iOS App (arm64)
        run: |
          xcodebuild clean build \
            -project Eentertainment.xcodeproj \
            -scheme Eentertainment \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Package .app into Unsigned .ipa (LiveContainer / SideStore / Sideloadly Ready)
        run: |
          mkdir -p Payload
          cp -r build/Build/Products/Release-iphoneos/Eentertainment.app Payload/
          zip -r9 Eentertainment-v5.7.7-iOS.ipa Payload

      - name: Upload Unsigned IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Eentertainment-v5.7.7-iOS-IPA
          path: Eentertainment-v5.7.7-iOS.ipa
          if-no-files-found: error

      - name: Publish Direct IPA to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v5.7.7-eentertainment
          name: "Eentertainment v5.7.7 — APK-parity JS Runner + Non-UTF8 HTML Decode"
          body: |
            ### Eentertainment v5.7.7

            🔬 **Diagnostics round 3 — both remaining failures fixed at the root**

            #### What's Fixed in v5.7.7:
            1. **JS runner: 'unsupported type' crash (APK-parity fix)**:
               - Every evaluated script now terminates with `; 'ok';` exactly like the
                 Android QuickJS runner does. Without it, evaluateJavaScript tried to
                 marshal the trailing JS function object (window.fetch / module.exports
                 assignments) back to Swift and threw 'JavaScript execution returned a
                 result of an unsupported type' — killing ALL JS addons before any fetch.
            2. **Non-UTF8 HTML bodies (cineplexbd.net)**:
               - The site serves 96,519-byte search/player pages that are NOT valid UTF-8.
                 Added a decode chain: gzip magic strip+inflate → UTF-8 → UTF-16 BOM →
                 ISO-Latin-1 (byte-total), with a hex head-dump log if truly undecodable.
            3. Applies to native scraper AND every JS addon via the fetch bridge.
          files: Eentertainment-v5.7.7-iOS.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
