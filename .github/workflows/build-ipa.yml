name: Build Eentertainment iOS IPA

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

permissions:
  contents: write

jobs:
  build-ipa:
    runs-on: macos-15
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: xcodegen generate

      - name: Resolve Swift Packages
        run: xcodebuild -resolvePackageDependencies -project Eentertainment.xcodeproj

      - name: Build Unsigned iOS App (arm64)
        run: |
          xcodebuild clean build \
            -project Eentertainment.xcodeproj \
            -scheme Eentertainment \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Package .app into Unsigned .ipa (LiveContainer / SideStore / Sideloadly Ready)
        run: |
          mkdir -p Payload
          cp -r build/Build/Products/Release-iphoneos/Eentertainment.app Payload/
          zip -r9 Eentertainment-v5.7.8-iOS.ipa Payload

      - name: Upload Unsigned IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Eentertainment-v5.7.8-iOS-IPA
          path: Eentertainment-v5.7.8-iOS.ipa
          if-no-files-found: error

      - name: Publish Direct IPA to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v5.7.8-eentertainment
          name: "Eentertainment v5.7.8 — VLC-Style Player Controls (Brightness, Subtitles, Audio Tracks, Speed)"
          body: |
            ### Eentertainment v5.7.8

            🎚️ **VLC-style playback controls — tap the "⋯" button in the player HUD**

            #### What's New in v5.7.8:
            1. **Playback Options panel** (player HUD "⋯" button):
               - **Playback speed**: 0.5× – 2× for both engines.
               - **Brightness slider** (screen-level, works for both engines).
               - **Volume slider** for the VLC engine.
               - **Audio Track / Language switching**: VLC audio track list; AVPlayer media selection groups.
               - **Subtitle loading**: pick a local .srt/.vtt file — attaches as a VLC subtitle slave; picks in AVPlayer mode auto-switch to VLC.
            2. **VLC-style gestures on the video**:
               - Vertical swipe on the LEFT third = brightness, RIGHT third = volume (VLC engine), middle = swipe down to dismiss.
            3. Screen brightness is restored on player exit.
          files: Eentertainment-v5.7.8-iOS.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
