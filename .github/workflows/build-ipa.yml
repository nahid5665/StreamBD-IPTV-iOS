name: Build Eentertainment iOS IPA

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

permissions:
  contents: write

jobs:
  build-ipa:
    runs-on: macos-15
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: xcodegen generate

      - name: Resolve Swift Packages
        run: xcodebuild -resolvePackageDependencies -project Eentertainment.xcodeproj

      - name: Build Unsigned iOS App (arm64)
        run: |
          xcodebuild clean build \
            -project Eentertainment.xcodeproj \
            -scheme Eentertainment \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Package .app into Unsigned .ipa (LiveContainer / SideStore / Sideloadly Ready)
        run: |
          mkdir -p Payload
          cp -r build/Build/Products/Release-iphoneos/Eentertainment.app Payload/
          zip -r9 Eentertainment-v5.6-iOS.ipa Payload

      - name: Upload Unsigned IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Eentertainment-v5.6-iOS-IPA
          path: Eentertainment-v5.6-iOS.ipa
          if-no-files-found: error

      - name: Publish Direct IPA to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v5.6.0-eentertainment
          name: "Eentertainment v5.6.0 — Dual-Engine Video Player & Addons Engine"
          body: |
            ### Eentertainment v5.6.0

            🎬 **Hardware-Accelerated Dual-Engine Video Player + Interactive Fullscreen HUD + Fixed Addon Streams**

            #### What's New in v5.6
            - **Per-Addon Status UI & Verified Working Streams**:
              - Live badges showing which addons have the title available, loading, or unavailable
              - Direct playback only from addons with verified playable streams
            - **Hardware-Accelerated Dual Engine (AVPlayer + MobileVLCKit)**:
              - Native Apple AVPlayer engine for all MP4 and HLS M3U8 streams (Cineplex BD, CTG Movies, RoarZone, Toffee, Live TV)
              - Fallback to MobileVLCKit for raw MPEG-TS, MKV, and custom network protocols
              - Fixes all video freeze/black-screen issues with instant hardware decoding
            - **Fixed Fullscreen HUD & Dismissal (Never Stuck)**:
              - Permanent top-left frosted-glass `(X)` close button (always visible & clickable)
              - Swipe-down-to-dismiss gesture on the full screen
              - Direct `onClose` binding guarantee that exits fullscreen immediately
              - Native UIKit tap recognizer ensures HUD controls toggle smoothly without touch swallowing
            - **Cineplex BD (BDIX) Full Scraper Integration**:
              - Instant single-request resolution for 1080P/720P direct MP4 video streams
            - **CTG Movies FTP (BDIX) Direct Links Engine**:
              - Direct extraction of high-speed BDIX MP4 streams from Cockpit API
            - **RoarZone EMBY Server Integration (Movies & Series)**:
              - Direct master.m3u8 stream resolution with Season & Episode support
          files: Eentertainment-v5.6-iOS.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
