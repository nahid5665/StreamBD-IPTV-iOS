name: Build Eentertainment iOS IPA

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

permissions:
  contents: write

jobs:
  build-ipa:
    runs-on: macos-15
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: xcodegen generate

      - name: Resolve Swift Packages
        run: xcodebuild -resolvePackageDependencies -project Eentertainment.xcodeproj

      - name: Build Unsigned iOS App (arm64)
        run: |
          xcodebuild clean build \
            -project Eentertainment.xcodeproj \
            -scheme Eentertainment \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Package .app into Unsigned .ipa (LiveContainer / SideStore / Sideloadly Ready)
        run: |
          mkdir -p Payload
          cp -r build/Build/Products/Release-iphoneos/Eentertainment.app Payload/
          zip -r9 Eentertainment-v5.7-iOS.ipa Payload

      - name: Upload Unsigned IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Eentertainment-v5.7-iOS-IPA
          path: Eentertainment-v5.7-iOS.ipa
          if-no-files-found: error

      - name: Publish Direct IPA to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v5.7.0-eentertainment
          name: "Eentertainment v5.7.0 — Dynamic JavaScript VOD Plugin Engine & Cineplex Sanitization"
          body: |
            ### Eentertainment v5.7.0
            
            🎬 **Dynamic JavaScript VOD Plugin Engine (`JSVODAddonRunner`) + Headless WebKit CORS Bridge + Cineplex Sanitization**

            #### What's New & Fixed in v5.7.0:
            1. **Native iOS JavaScript VOD Plugin Runner (`JSVODAddonRunner.swift`)**:
               - Implemented isolated headless `WKWebView` JavaScript execution host matching Android's dynamic `.js` plugin architecture.
               - Injected `NativeFetchBridge` (`WKScriptMessageHandlerWithReply`) routing `window.fetch()` directly to native `URLSession`, completely bypassing browser CORS restrictions.
               - In-memory script caching (`[String: String]`) for instantaneous subsequent queries.
               - Actor-based `ConcurrencyLimiter` capping simultaneous WebKit executions to 3 instances, completely avoiding iOS Jetsam memory pressure.
               - Bundled `crypto-js.min.js` and common runtime polyfills (`require`, `process`, `Buffer`).
               - Automatically executes all 24 StreamBD `.js` addons (`cineplexbd.js`, `ctgmovies.js`, `movielinkbd.js`, `netmirror.js`, `11plusweb.js`, `vixsrc.js`, etc.) in real time.
            2. **Cineplex BD Dual-Layer Fix**:
               - **Primary:** Dynamically evaluated via `cineplexbd.js` in `JSVODAddonRunner`.
               - **Secondary Fallback:** Robust Swift `CineplexScraper` with complete SQL-friendly query sanitization (strip colons, dashes, apostrophes, ampersands) and fallback prefix matching.
            3. **Emby & VLC Dual-Engine Continuity**:
               - RoarZone EMBY official `PlaybackInfo` direct stream (`stream.mkv` / `stream.mp4`) with real `mediaSourceId`.
               - Auto-fallback from AVPlayer to MobileVLCKit on error and manual switch button.
               - Non-blocking close button always visible.
          files: Eentertainment-v5.7-iOS.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
