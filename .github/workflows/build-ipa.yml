name: Build Eentertainment iOS IPA

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

permissions:
  contents: write

jobs:
  build-ipa:
    runs-on: macos-15
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: xcodegen generate

      - name: Resolve Swift Packages
        run: xcodebuild -resolvePackageDependencies -project Eentertainment.xcodeproj

      - name: Build Unsigned iOS App (arm64)
        run: |
          xcodebuild clean build \
            -project Eentertainment.xcodeproj \
            -scheme Eentertainment \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Package .app into Unsigned .ipa (LiveContainer / SideStore / Sideloadly Ready)
        run: |
          mkdir -p Payload
          cp -r build/Build/Products/Release-iphoneos/Eentertainment.app Payload/
          zip -r9 Eentertainment-v5.8.0-iOS.ipa Payload

      - name: Upload Unsigned IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Eentertainment-v5.8.0-iOS-IPA
          path: Eentertainment-v5.8.0-iOS.ipa
          if-no-files-found: error

      - name: Publish Direct IPA to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v5.8.0-eentertainment
          name: "Eentertainment v5.8.0 — Focused Addons, Live Results, VLC-Style HUD & Custom JS Addons"
          body: |
            ### Eentertainment v5.8.0

            ✨ **Faster, cleaner, more VLC-like**

            #### What's Changed in v5.8.0:
            1. **Focused addon set**: bundled addons trimmed to Cineplex BD (BDIX), CTG Movies FTP and
               RoarZone EMBY — the movie page now checks 3 sources instead of 23.
            2. **Live stream results**: links appear in the movie page the moment each addon finds
               them (no more waiting for every addon to finish before anything shows).
            3. **Buffering spinner fix**: the loading indicator now clears as soon as frames advance.
            4. **Player HUD cleanup**: the always-visible "Back" pill is gone; a simple back arrow
               appears with the controls when you tap the screen.
            5. **VLC-style volume row** in the HUD (speaker + slider): VLC engine volume directly;
               system volume slider (MPVolumeView) for AVPlayer.
            6. **Custom JS addons**: Settings → Add Addon now accepts any .js scraper URL
               (e.g. https://cdn.jsdelivr.net/gh/nahid5665/streambd-libs@main/addons/movielinkbd.js)
               alongside Stremio manifests — stored, toggleable and deletable.
          files: Eentertainment-v5.8.0-iOS.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
