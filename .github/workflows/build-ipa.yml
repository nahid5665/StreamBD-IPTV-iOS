name: Build Eentertainment iOS IPA

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

permissions:
  contents: write

jobs:
  build-ipa:
    runs-on: macos-15
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: xcodegen generate

      - name: Resolve Swift Packages
        run: xcodebuild -resolvePackageDependencies -project Eentertainment.xcodeproj

      - name: Build Unsigned iOS App (arm64)
        run: |
          xcodebuild clean build \
            -project Eentertainment.xcodeproj \
            -scheme Eentertainment \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Package .app into Unsigned .ipa (LiveContainer / SideStore / Sideloadly Ready)
        run: |
          mkdir -p Payload
          cp -r build/Build/Products/Release-iphoneos/Eentertainment.app Payload/
          zip -r9 Eentertainment-v5.6-iOS.ipa Payload

      - name: Upload Unsigned IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Eentertainment-v5.6-iOS-IPA
          path: Eentertainment-v5.6-iOS.ipa
          if-no-files-found: error

      - name: Publish Direct IPA to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v5.6.3-eentertainment
          name: "Eentertainment v5.6.3 — Cineplex HTTP Scheme & Emby PlaybackInfo API Fix"
          body: |
            ### Eentertainment v5.6.3

            🎬 **Cineplex Plain HTTP BDIX Scheme Fix + Emby PlaybackInfo Endpoint Direct Resolution**

            #### What's Fixed in v5.6.3:
            1. **Cineplex BD Scheme Fix (`http://cineplexbd.net`)**:
               - Reverted `baseUrl` to plain `http://cineplexbd.net/` to eliminate TLS handshake failures on BDIX ISP networks.
               - Allowed by iOS via `NSAllowsArbitraryLoads: true` in `Info.plist`.
               - Realtime scraping for both movies (`player.php`) and TV series (`watch.php`) with MD5 tokens and session cookies.
            2. **RoarZone Emby Real PlaybackInfo API Resolution**:
               - Interrogates Emby's `/Items/{itemId}/PlaybackInfo?UserId={userId}&api_key={token}` endpoint after authentication.
               - Extracts server-authoritative `mediaSourceId`, `Container`, `DirectStreamUrl`, and `TranscodingUrl`.
               - Direct stream constructed with native container (`stream.mkv` / `stream.mp4`) allowing instant hardware playback in MobileVLCKit / AVPlayer.
            3. **Verified Working Addons**:
               - CTG Movies FTP [BDIX]
               - RoarZone EMBY [BDIX] (PlaybackInfo Direct Stream)
               - Cineplex BD [BDIX] (Realtime HTTP BDIX)
               - Custom Stremio HTTP Addons (Settings tab)
          files: Eentertainment-v5.6-iOS.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
