name: Build Eentertainment iOS IPA

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

permissions:
  contents: write

jobs:
  build-ipa:
    runs-on: macos-15
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: xcodegen generate

      - name: Resolve Swift Packages
        run: xcodebuild -resolvePackageDependencies -project Eentertainment.xcodeproj

      - name: Build Unsigned iOS App (arm64)
        run: |
          xcodebuild clean build \
            -project Eentertainment.xcodeproj \
            -scheme Eentertainment \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Package .app into Unsigned .ipa (LiveContainer / SideStore / Sideloadly Ready)
        run: |
          mkdir -p Payload
          cp -r build/Build/Products/Release-iphoneos/Eentertainment.app Payload/
          zip -r9 Eentertainment-v5.8.2-iOS.ipa Payload

      - name: Upload Unsigned IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Eentertainment-v5.8.2-iOS-IPA
          path: Eentertainment-v5.8.2-iOS.ipa
          if-no-files-found: error

      - name: Publish Direct IPA to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v5.8.2-eentertainment
          name: "Eentertainment v5.8.2 — dx.bi UI Clone"
          body: |
            ### Eentertainment v5.8.2 — dx.bi UI

            #### This build:
            1. **Full dx.bi UI clone** (from notdxbi/dxbi-stremio ios/Dxbi): Apple TV-style
               Home with auto-rotating billboard, Netflix-red accent, Liquid Glass buttons,
               Bebas Neue DX.BI logo and intro splash, Top-10 rank numbers, zoom navigation
               transitions, 4 tabs (Home · Discover · Library · Search), settings behind
               the avatar.
            2. **StreamsSheet**: white "Play · Same as Last Time" card, quality/source filter
               chips, badge rows for every addon stream (dx.bi's way: last pick replays at once).
            3. Live TV (BDTube server) stays wired with auto token refresh; live events on Home.
            4. Previous fixes kept: JS addon persistence, BDTube token auto-refresh.
          files: Eentertainment-v5.8.2-iOS.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
