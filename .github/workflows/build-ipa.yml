name: Build Eentertainment iOS IPA

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

permissions:
  contents: write

jobs:
  build-ipa:
    runs-on: macos-15
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: xcodegen generate

      - name: Resolve Swift Packages
        run: xcodebuild -resolvePackageDependencies -project Eentertainment.xcodeproj

      - name: Build Unsigned iOS App (arm64)
        run: |
          xcodebuild clean build \
            -project Eentertainment.xcodeproj \
            -scheme Eentertainment \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Package .app into Unsigned .ipa (LiveContainer / SideStore / Sideloadly Ready)
        run: |
          mkdir -p Payload
          cp -r build/Build/Products/Release-iphoneos/Eentertainment.app Payload/
          zip -r9 Eentertainment-v5.6-iOS.ipa Payload

      - name: Upload Unsigned IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Eentertainment-v5.6-iOS-IPA
          path: Eentertainment-v5.6-iOS.ipa
          if-no-files-found: error

      - name: Publish Direct IPA to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v5.6.2-eentertainment
          name: "Eentertainment v5.6.2 — RoarZone mediasource_ Emby Fix & Cineplex Realtime BDIX Scraper"
          body: |
            ### Eentertainment v5.6.2

            🎬 **RoarZone Emby mediasource_ Fix + Cineplex BDIX Realtime Multi-Resolution Scraper + Cookie / Token Auth**

            #### What's Fixed in v5.6.2:
            1. **RoarZone Emby Playback Fix (`mediasource_` parameter)**:
               - Fixed `MediaSourceId=mediasource_{itemId}` for movies and `MediaSourceId=mediasource_{epId}` for TV series.
               - Emby no longer returns `HTTP 400 Bad Request`.
               - AVPlayer now streams HLS master playlist directly with hardware acceleration without triggering `AVPlayerError: resource unavailable`.
               - Direct stream option updated with `MediaSourceId=mediasource_{id}` for MobileVLCKit.
            2. **Cineplex BD Scraper Fix (`https://cineplexbd.net`)**:
               - Upgraded scraper regex to extract movie search results (`view.php?id=...`) and TV series (`watch.php?id=...`) with clean title extraction.
               - Preserves full Nginx secure link tokens (`?md5=...&expires=...`) for MP4 streams.
               - Added automatic `Set-Cookie` header capture (`hlse`, `hlsk`, `REDFORCE`) for HLS master streams.
               - Added proper `Referer` and `Origin` headers required by Cineplex's media gateway.
            3. **Verified Working Addons**:
               - CTG Movies FTP [BDIX]
               - RoarZone EMBY [BDIX] (HLS + Direct Stream)
               - Cineplex BD [BDIX] (MP4 + HLS)
               - Custom Stremio HTTP Addons (via Settings tab)
          files: Eentertainment-v5.6-iOS.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
