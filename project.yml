name: Eentertainment
options:
  bundleIdPrefix: com.eentertainment
  deploymentTarget:
    iOS: "16.0"
  xcodeVersion: "15.0"

packages:
  VLCKit:
    url: https://github.com/rsalesas/VLCKit.git
    from: "3.6.4"

targets:
  Eentertainment:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: StreamBDIPTV/Sources
      - path: StreamBDIPTV/Assets.xcassets
      - path: StreamBDIPTV/Resources
        buildPhase: resources
    dependencies:
      - package: VLCKit
        product: VLCKit
    info:
      path: StreamBDIPTV/Info.plist
      properties:
        CFBundleDisplayName: "Eentertainment"
        CFBundleName: "Eentertainment"
        CFBundleIdentifier: "com.eentertainment.app"
        CFBundleShortVersionString: "5.7.9"
        CFBundleVersion: "71"
        LSRequiresIPhoneOS: true
        UILaunchScreen:
          UIColorName: ""
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIBackgroundModes:
          - audio
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.eentertainment.app
        PRODUCT_NAME: Eentertainment
        MARKETING_VERSION: "5.7.9"
        CURRENT_PROJECT_VERSION: "71"
        SWIFT_VERSION: "5.9"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_IDENTITY: ""
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGNING_ALLOWED: NO
